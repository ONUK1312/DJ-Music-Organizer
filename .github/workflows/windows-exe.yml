name: Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install aubio mutagen PySide6

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name DJ-Music-Organizer dj_organizer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Music-Organizer-Windows
          path: dist/DJ-Music-Organizer.exe
