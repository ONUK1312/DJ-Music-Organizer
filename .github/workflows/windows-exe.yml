name: Windows EXE

on:
  push:
    branches:
      - windows-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install aubio mutagen PySide6

      - name: Download KeyFinder
        shell: pwsh
        run: |
          gh run download 35556529202 -n keyfinder-cli-windows
          New-Item -ItemType Directory -Force -Path bundled
          Move-Item keyfinder-cli.exe bundled/keyfinder-cli.exe

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name DJ-Music-Organizer --add-binary "bundled/keyfinder-cli.exe;bundled" dj_organizer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Music-Organizer-Windows
          path: dist/DJ-Music-Organizer.exe
