name: Windows EXE

on:
  push:
    branches:
      - windows-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install aubio mutagen PySide6

      - name: Download KeyFinder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow windows-keyfinder.yml --branch windows-build --status success --limit 1 --json databaseId --jq ".[0].databaseId"
          New-Item -ItemType Directory -Force -Path bundled
          gh run download $run -n keyfinder-cli-windows -D bundled

      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundled
          pyinstaller --onefile --windowed --name DJ-Music-Organizer `
            --add-binary "bundled\keyfinder-cli.exe;bundled" `
            --add-binary "bundled\libkeyfinder.dll;bundled" `
            --add-binary "bundled\avcodec-63.dll;bundled" `
            --add-binary "bundled\avformat-63.dll;bundled" `
            --add-binary "bundled\avutil-61.dll;bundled" `
            --add-binary "bundled\swresample-7.dll;bundled" `
            --add-binary "bundled\libgcc_s_seh-1.dll;bundled" `
            --add-binary "bundled\libstdc++-6.dll;bundled" `
            --add-binary "bundled\libwinpthread-1.dll;bundled" `
            dj_organizer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Music-Organizer-Windows
          path: dist/DJ-Music-Organizer.exe
