name: Windows Build Test

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy PySide6 mutagen pyinstaller

      - name: Clone aubio 0.4.9
        shell: pwsh
        run: |
          git clone --depth 1 --branch 0.4.9 https://github.com/aubio/aubio.git aubio-src

      - name: Build aubio
        shell: pwsh
        run: |
          cd aubio-src
          python setup.py build
          python setup.py install

      - name: Test aubio
        shell: pwsh
        run: |
          python -c "import aubio; print('aubio loaded:', aubio.version)"
          python -c "import aubio; print('tempo:', aubio.tempo('default', 1024, 512, 44100))"
