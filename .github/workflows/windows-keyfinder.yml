name: Windows KeyFinder Test

on:
  push:
    branches:
      - windows-build
  workflow_dispatch:

jobs:
  test-keyfinder:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          choco install cmake ninja ffmpeg pkgconfiglite -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: windows-vcpkg-${{ runner.arch }}-ffmpeg-fftw3-v1

      - name: Install vcpkg and FFTW3
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install fftw3:x64-windows ffmpeg:x64-windows

      - name: Clone libkeyfinder
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/mixxxdj/libkeyfinder.git libkeyfinder-src

      - name: Build libkeyfinder
        shell: pwsh
        run: |
          cmake -S libkeyfinder-src -B libkeyfinder-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTING=OFF
          cmake --build libkeyfinder-build --parallel
          cmake --install libkeyfinder-build --prefix C:/keyfinder-install

      - name: Show libkeyfinder build
        shell: pwsh
        run: |
          Get-ChildItem -Recurse libkeyfinder-build | Where-Object {
            $_.Name -match 'keyfinder.*\.(dll|lib|a)$'
          } | Select-Object FullName

      - name: Clone keyfinder-cli
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/EvanPurkhiser/keyfinder-cli.git keyfinder-cli-src

      - name: Configure keyfinder-cli
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "C:\vcpkg\installed\x64-windows\lib\pkgconfig"
          cmake -S keyfinder-cli-src -B keyfinder-cli-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:/keyfinder-install;C:/vcpkg/installed/x64-windows" `
            -DFFTW3_LIBRARY="C:/vcpkg/installed/x64-windows/lib/fftw3.lib" `
            -DFFTW3_INCLUDE_DIR="C:/vcpkg/installed/x64-windows/include"

      - name: Build keyfinder-cli
        shell: pwsh
        run: |
          cmake --build keyfinder-cli-build --parallel

      - name: Test keyfinder-cli
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Recurse keyfinder-cli-build -Filter keyfinder-cli.exe | Select-Object -First 1).FullName
          Write-Host "KeyFinder: $exe"

          ffmpeg -y -f lavfi -i "sine=frequency=261.63:duration=10" -ar 44100 -ac 2 test-tone.wav

          Write-Host "--- Running KeyFinder ---"
          & $exe test-tone.wav

          if ($LASTEXITCODE -ne 0) {
            throw "KeyFinder failed with exit code $LASTEXITCODE"
          }

      
      - name: Show KeyFinder DLL dependencies
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Recurse keyfinder-cli-build -Filter keyfinder-cli.exe | Select-Object -First 1).FullName
          Write-Host "KeyFinder: $exe"
          objdump -p $exe | Select-String "DLL Name"
          Write-Host "--- vcpkg DLLs ---"
          Get-ChildItem C:\\vcpkg\\installed\\x64-windows\\bin -Filter *.dll | Select-Object FullName
          Write-Host "--- MinGW DLLs ---"
          Get-ChildItem C:\\mingw64\\bin -Filter *.dll -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "gcc|stdc\+\+|winpthread" } | Select-Object FullName

      - name: Package KeyFinder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path keyfinder-package
          Copy-Item (Get-ChildItem -Recurse keyfinder-cli-build -Filter keyfinder-cli.exe | Select-Object -First 1).FullName keyfinder-package\
          Copy-Item C:\keyfinder-install\bin\libkeyfinder.dll keyfinder-package\
          Copy-Item C:\vcpkg\installed\x64-windows\bin\avcodec-63.dll keyfinder-package\
          Copy-Item C:\vcpkg\installed\x64-windows\bin\avformat-63.dll keyfinder-package\
          Copy-Item C:\vcpkg\installed\x64-windows\bin\avutil-61.dll keyfinder-package\
          Copy-Item C:\vcpkg\installed\x64-windows\bin\swresample-7.dll keyfinder-package\
          Copy-Item C:\mingw64\bin\libgcc_s_seh-1.dll keyfinder-package\
          Copy-Item C:\mingw64\bin\libstdc++-6.dll keyfinder-package\
          Copy-Item C:\mingw64\bin\libwinpthread-1.dll keyfinder-package\

      - name: Upload keyfinder-cli
        uses: actions/upload-artifact@v4
        with:
          name: keyfinder-cli-windows
          path: keyfinder-package
