name: Windows KeyFinder Test

on:
  push:
    branches:
      - windows-build
  workflow_dispatch:

jobs:
  test-keyfinder:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          choco install cmake ninja ffmpeg pkgconfiglite -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: windows-vcpkg-${{ runner.arch }}-ffmpeg-fftw3-v1

      - name: Install vcpkg and FFTW3
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install fftw3:x64-windows ffmpeg:x64-windows

      - name: Clone libkeyfinder
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/mixxxdj/libkeyfinder.git libkeyfinder-src

      - name: Build libkeyfinder
        shell: pwsh
        run: |
          cmake -S libkeyfinder-src -B libkeyfinder-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTING=OFF
          cmake --build libkeyfinder-build --parallel
          cmake --install libkeyfinder-build --prefix C:/keyfinder-install

      - name: Show libkeyfinder build
        shell: pwsh
        run: |
          Get-ChildItem -Recurse libkeyfinder-build | Where-Object {
            $_.Name -match 'keyfinder.*\.(dll|lib|a)$'
          } | Select-Object FullName

      - name: Clone keyfinder-cli
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/EvanPurkhiser/keyfinder-cli.git keyfinder-cli-src

      - name: Configure keyfinder-cli
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "C:\vcpkg\installed\x64-windows\lib\pkgconfig"
          cmake -S keyfinder-cli-src -B keyfinder-cli-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:/keyfinder-install;C:/vcpkg/installed/x64-windows" `
            -DFFTW3_LIBRARY="C:/vcpkg/installed/x64-windows/lib/fftw3.lib" `
            -DFFTW3_INCLUDE_DIR="C:/vcpkg/installed/x64-windows/include"

      - name: Build keyfinder-cli
        shell: pwsh
        run: |
          cmake --build keyfinder-cli-build --parallel

      - name: Test keyfinder-cli
        shell: pwsh
        run: |
          Get-ChildItem -Recurse keyfinder-cli-build | Where-Object {
            $_.Name -eq 'keyfinder-cli.exe'
          } | Select-Object FullName
